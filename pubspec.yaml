name: goslow
description: "GoSlow — 把考纲词汇镶嵌进真实的阅读、观影、听歌场景"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 本地数据库
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # TTS 发音
  flutter_tts: ^4.1.0

  # 文件导入
  file_picker: ^10.1.0
  archive: ^4.2.0
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.31.1
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/dict.db

  fonts:
    - family: LXGW WenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf